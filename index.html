<!doctype html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CineBook - ระบบจองตั๋วภาพยนตร์</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        
         :root {
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        
        body {
            margin: 0;
            font-family: 'Segoe UI', 'Noto Sans Thai', sans-serif;
            background: #0f1117;
            color: #eaeaea;
        }
        
        .app-bg {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 24px;
        }
        
        .login-card {
            background: #1a1d27;
            border-radius: 16px;
            padding: 32px;
            width: 360px;
            max-width: 100%;
            height: fit-content;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        
        .login-card h1 {
            margin: 0 0 4px;
        }
        
        .subtitle {
            color: #9aa0ac;
            margin-top: 0;
        }
        
        .tabs {
            display: flex;
            gap: 8px;
            margin: 16px 0;
        }
        
        .tabs button {
            flex: 1;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #22252f;

        }
        
        .tabs button.active {

        label {

        input,

        input:disabled {

        button.primary {

        button {

        }
        
        .view {

        .view-header {
            display: flex;
            justify-content: space-between;

        .header-actions button {
            margin-left: 8px;

        .header-actions button.active {

        .banner {

        .grid {

        .panel {

        .movie-card {

        .movie-card:hover {

        .movie-poster-wrap {

            background: #22252f;

            align-items: center;

            overflow: hidden;
        }
        
        .movie-poster-wrap img {

        }
        
        .movie-poster-placeholder {

        .movie-card-body {

            flex: 1;
            display: flex;

        }
        
        .movie-card-body h3 {

        }
        
        .movie-card-body .muted {

        }

        }
        
        .showtime-list {
            display: flex;

        }
        
        .showtime-chip {

        .showtime-row {

        .seat-selector {
            margin: 16px 0;

        }
        
        .screen {
            text-align: center;
            background: #333;

        .seat-row {

        .row-label {

        .seat {

        .seat.selected {

        .seat.booked {

        .legend {

        .legend .box {
            display: inline-block;
            width: 12px;
            height: 12px;

        }
        
        .legend .selected {
            background: #4f7cff;
        }
        
        .legend .booked {

        }
        
        .summary-row {
            display: flex;

        .actions {
            display: flex;

        }
        
        .actions button {
            padding: 10px 16px;

            border: 1px solid #333;

        }
        
        .actions button.primary {
            background: #4f7cff;
            border-color: #4f7cff;

        }
        
        .actions button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }
        
        .ticket-card {
            background: #22252f;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 10px;
        }
        
        .inline-form {
            display: flex;
            gap: 8px;

        .inline-form input,
        .inline-form select {

        .form-grid {

        }
        
        .form-grid-full {

        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th,
        td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #2a2d38;
            font-size: 14px;
            white-space: nowrap;
        }
        
        .error-box {
            background: #3a2222;
            border: 1px solid #5a2f2f;
            padding: 16px;
            border-radius: 8px;
            max-width: 600px;
            margin: 60px auto;
            font-family: monospace;
            white-space: pre-wrap;
        }
        
        .card-row-gap {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        
        .small-btn {
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #0f1117;
            color: #eaeaea;
        }
        
        .file-input {
            padding: 8px 0;
        }
        
        .btn-group {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }
        /* Modal */
        
        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, .65);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
            overflow-y: auto;
        }
        
        .modal {
            background: #1a1d27;
            border: 1px solid #2a2d38;
            border-radius: 12px;
            padding: 20px;

            max-width: 100%;
            max-height: 100%;

        }
        
        .poster-preview {
            width: 120px;
            border-radius: 8px;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script>
        (function() {
            'use strict';
            try {
                var useState = React.useState;
                var useMemo = React.useMemo;
                var h = React.createElement;

                var RATING_INFO = {
                    G: 'G — เหมาะกับผู้ชมทุกวัย',
                    PG: 'PG — เด็กควรมีผู้ปกครองแนะนำ',
                    'PG-13': 'PG-13 — ผู้ชมอายุต่ำกว่า 13 ปี ควรมีผู้ปกครองแนะนำเป็นพิเศษ',
                    R: 'R — ผู้ชมอายุต่ำกว่า 18 ปี ต้องมีผู้ปกครองควบคุมอย่างใกล้ชิด'
                };

                /* ============================================================
                   MODELS
                   ============================================================ */

                // ---- Person (abstract) : ABSTRACTION + ENCAPSULATION ----
                function Person(id, name, email) {
                    if (this.constructor === Person) throw new Error('Person เป็น abstract class สร้าง instance ตรงๆ ไม่ได้');
                    this.id = id;
                    this.name = name;
                    this.email = email;
                }
                Person.prototype.getId = function() {
                    return this.id;
                };
                Person.prototype.getName = function() {
                    return this.name;
                };
                Person.prototype.getEmail = function() {
                    return this.email;
                };
                Person.prototype.setName = function(name) {
                    if (!name.trim()) throw new Error('ชื่อห้ามว่าง');
                    this.name = name;
                };
                Person.prototype.getRole = function() {
                    throw new Error('ต้อง override getRole()');
                };
                Person.prototype.getDashboardInfo = function() {
                    throw new Error('ต้อง override getDashboardInfo()');
                };

                // ---- Customer : INHERITANCE จาก Person ----
                function Customer(id, name, email) {
                    Person.call(this, id, name, email);
                    this._bookingHistory = [];
                }
                Customer.prototype = Object.create(Person.prototype);
                Customer.prototype.constructor = Customer;
                Customer.prototype.addBooking = function(bookingId) {
                    this._bookingHistory.push(bookingId);
                };
                Customer.prototype.getBookingHistory = function() {
                    return this._bookingHistory.slice();
                };
                Customer.prototype.getRole = function() {
                    return 'Customer';
                };
                Customer.prototype.getDashboardInfo = function() {
                    return this.name + ' จองไปแล้ว ' + this._bookingHistory.length + ' รายการ';
                };

                // ---- Admin : INHERITANCE จาก Person ----
                function Admin(id, name, email, accessLevel) {
                    Person.call(this, id, name, email);
                    this._accessLevel = accessLevel || 1;
                }
                Admin.prototype = Object.create(Person.prototype);
                Admin.prototype.constructor = Admin;
                Admin.prototype.getAccessLevel = function() {
                    return this._accessLevel;
                };
                Admin.prototype.canManageMovies = function() {
                    return this._accessLevel >= 1;
                };
                Admin.prototype.getRole = function() {
                    return 'Admin';
                };
                Admin.prototype.getDashboardInfo = function() {
                    return this.name + ' (ผู้ดูแลระบบ ระดับสิทธิ์ ' + this._accessLevel + ')';
                };

                // ---- Movie : ENCAPSULATION ----
                function Movie(id, title, genre, durationMinutes, rating, posterUrl) {
                    this._id = id;
                    this._title = title;
                    this._genre = genre;
                    this._durationMinutes = durationMinutes;
                    this._rating = rating;
                    this._posterUrl = posterUrl || '';
                }
                Movie.prototype.getId = function() {
                    return this._id;
                };
                Movie.prototype.getTitle = function() {
                    return this._title;
                };
                Movie.prototype.getGenre = function() {
                    return this._genre;
                };
                Movie.prototype.getDuration = function() {
                    return this._durationMinutes;
                };
                Movie.prototype.getRating = function() {
                    return this._rating;
                };
                Movie.prototype.getPosterUrl = function() {
                    return this._posterUrl;
                };
                Movie.prototype.setTitle = function(t) {
                    if (!t.trim()) throw new Error('ชื่อหนังห้ามว่าง');
                    this._title = t;
                };
                Movie.prototype.setGenre = function(g) {
                    if (!g.trim()) throw new Error('แนวหนังห้ามว่าง');
                    this._genre = g;
                };
                Movie.prototype.setDuration = function(m) {
                    if (!(m > 0)) throw new Error('ความยาวต้องมากกว่า 0');
                    this._durationMinutes = m;
                };
                Movie.prototype.setRating = function(r) {
                    this._rating = r;
                };
                Movie.prototype.setPosterUrl = function(u) {
                    this._posterUrl = u || '';
                };

                // ---- Seat : ENCAPSULATION ----
                function Seat(seatNumber, status) {
                    this._seatNumber = seatNumber;
                    this._status = status || 'AVAILABLE';
                }
                Seat.prototype.getSeatNumber = function() {
                    return this._seatNumber;
                };
                Seat.prototype.getStatus = function() {
                    return this._status;
                };
                Seat.prototype.isAvailable = function() {
                    return this._status === 'AVAILABLE';
                };
                Seat.prototype.book = function() {
                    if (!this.isAvailable()) throw new Error('ที่นั่ง ' + this._seatNumber + ' ถูกจองไปแล้ว');
                    this._status = 'BOOKED';
                };
                Seat.prototype.release = function() {
                    this._status = 'AVAILABLE';
                };

                // ---- Showtime ----
                function Showtime(id, movie, startTime, hall, price, rows, cols) {
                    this._id = id;
                    this._movie = movie;
                    this._startTime = startTime;
                    this._hall = hall;
                    this._price = price;
                    this._seats = this._generateSeats(rows || 5, cols || 8);
                }
                Showtime.prototype._generateSeats = function(rows, cols) {
                    var seats = [];
                    var rowLetters = 'ABCDEFGHIJ'.slice(0, rows).split('');
                    for (var i = 0; i < rowLetters.length; i++)
                        for (var c = 1; c <= cols; c++) seats.push(new Seat(rowLetters[i] + c));
                    return seats;
                };
                Showtime.prototype.getId = function() {
                    return this._id;
                };
                Showtime.prototype.getMovie = function() {
                    return this._movie;
                };
                Showtime.prototype.getStartTime = function() {
                    return this._startTime;
                };
                Showtime.prototype.getHall = function() {
                    return this._hall;
                };
                Showtime.prototype.getPrice = function() {
                    return this._price;
                };
                Showtime.prototype.getSeats = function() {
                    return this._seats.slice();
                };
                Showtime.prototype.findSeat = function(num) {
                    for (var i = 0; i < this._seats.length; i++)
                        if (this._seats[i].getSeatNumber() === num) return this._seats[i];
                    return undefined;
                };
                Showtime.prototype.getAvailableSeatCount = function() {
                    return this._seats.filter(function(s) {
                        return s.isAvailable();
                    }).length;
                };
                Showtime.prototype.getBookedSeatCount = function() {
                    return this._seats.length - this.getAvailableSeatCount();
                };
                Showtime.prototype.restoreBookedSeats = function(nums) {
                    for (var i = 0; i < nums.length; i++) {
                        var s = this.findSeat(nums[i]);
                        if (s && s.isAvailable()) s.book();
                    }
                };
                // ---- setters สำหรับแอดมินแก้ไขรอบฉาย ----
                Showtime.prototype.setStartTime = function(t) {
                    if (!t) throw new Error('กรุณาระบุวันเวลารอบฉาย');
                    this._startTime = t;
                };
                Showtime.prototype.setHall = function(hall) {
                    if (!hall.trim()) throw new Error('ชื่อโรงห้ามว่าง');
                    this._hall = hall;
                };
                Showtime.prototype.setPrice = function(p) {
                    if (!(p > 0)) throw new Error('ราคาต้องมากกว่า 0');
                    if (this.getBookedSeatCount() > 0) throw new Error('รอบนี้มีคนจองแล้ว ไม่สามารถแก้ราคาได้');
                    this._price = p;
                };

                // ---- Ticket ----
                function Ticket(id, showtime, seatNumber, price) {
                    this._id = id;
                    this._showtime = showtime;
                    this._seatNumber = seatNumber;
                    this._price = price;
                }
                Ticket.prototype.getId = function() {
                    return this._id;
                };
                Ticket.prototype.getShowtime = function() {
                    return this._showtime;
                };
                Ticket.prototype.getSeatNumber = function() {
                    return this._seatNumber;
                };
                Ticket.prototype.getPrice = function() {
                    return this._price;
                };
                Ticket.prototype.printSummary = function() {
                    return this._showtime.getMovie().getTitle() + ' | ที่นั่ง ' + this._seatNumber + ' | ' + this._price + ' บาท';
                };

                // ---- PaymentMethod (abstract) : ABSTRACTION + POLYMORPHISM ----
                function PaymentMethod(amount) {
                    if (this.constructor === PaymentMethod) throw new Error('PaymentMethod เป็น abstract class');
                    this.amount = amount;
                }
                PaymentMethod.prototype.getAmount = function() {
                    return this.amount;
                };
                PaymentMethod.prototype.pay = function() {
                    throw new Error('ต้อง override pay()');
                };

                // จ่ายเงินสด: จำนวนเงินคือราคาตั๋วเต็มจำนวนเสมอ ไม่ให้ผู้ใช้กรอกเอง
                function CashPayment(amount) {
                    PaymentMethod.call(this, amount);
                }
                CashPayment.prototype = Object.create(PaymentMethod.prototype);
                CashPayment.prototype.constructor = CashPayment;
                CashPayment.prototype.pay = function() {
                    return 'ชำระเงินสด ' + this.amount + ' บาท (เต็มจำนวน ไม่มีเงินทอน)';
                };

                // จ่ายบัตรเครดิต: ต้องมีเลขบัตร/วันหมดอายุ/ชื่อผู้ถือบัตร/CVV ครบตามจริง
                function CreditCardPayment(amount, cardNumber, expiryDate, holderName, cvv) {
                    PaymentMethod.call(this, amount);
                    this.cardNumber = (cardNumber || '').replace(/\s+/g, '');
                    this.expiryDate = expiryDate || '';
                    this.holderName = holderName || '';
                    this.cvv = cvv || '';
                }
                CreditCardPayment.prototype = Object.create(PaymentMethod.prototype);
                CreditCardPayment.prototype.constructor = CreditCardPayment;
                CreditCardPayment.prototype.pay = function() {
                    if (!/^\d{13,19}$/.test(this.cardNumber)) throw new Error('เลขบัตรไม่ถูกต้อง (ต้องเป็นตัวเลข 13-19 หลัก)');
                    if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(this.expiryDate)) throw new Error('วันหมดอายุต้องอยู่ในรูปแบบ MM/YY');
                    if (!this.holderName.trim()) throw new Error('กรุณากรอกชื่อ-สกุลผู้ถือบัตร');
                    if (!/^\d{3}$/.test(this.cvv)) throw new Error('CVV ต้องเป็นตัวเลข 3 หลัก');
                    var last4 = this.cardNumber.slice(-4);
                    return 'จ่ายผ่านบัตรเครดิตของ ' + this.holderName + ' เลขลงท้าย ' + last4 + ' จำนวน ' + this.amount + ' บาท';
                };

                // ใช้ตอนโหลด booking เก่าจาก localStorage กลับมา (ไม่ต้องจ่ายซ้ำ)
                function ReloadedPayment(amount, summary) {
                    PaymentMethod.call(this, amount);
                    this.summary = summary;
                }
                ReloadedPayment.prototype = Object.create(PaymentMethod.prototype);
                ReloadedPayment.prototype.constructor = ReloadedPayment;
                ReloadedPayment.prototype.pay = function() {
                    return this.summary;
                };

                // ---- Booking : ENCAPSULATION, เรียก payment.pay() แบบ polymorphic ----
                function Booking(id, customerId, tickets, payment) {
                    this._id = id;
                    this._customerId = customerId;
                    this._tickets = tickets;
                    this._bookingTime = new Date().toISOString();
                    this._paymentSummary = payment.pay();
                }
                Booking.prototype.getId = function() {
                    return this._id;
                };
                Booking.prototype.getCustomerId = function() {
                    return this._customerId;
                };
                Booking.prototype.getTickets = function() {
                    return this._tickets.slice();
                };
                Booking.prototype.getBookingTime = function() {
                    return this._bookingTime;
                };
                Booking.prototype.getPaymentSummary = function() {
                    return this._paymentSummary;

                        return s + t.getPrice();
                    }, 0);

                /* ============================================================
                   SERVICES
                   ============================================================ */

                var StorageService = {
                    save: function(key, data) {
                        try {
                            localStorage.setItem(key, JSON.stringify(data));
                        } catch (e) {
                            console.error(e);
                        }
                    },
                    load: function(key) {
                        try {
                            var raw = localStorage.getItem(key);
                            return raw ? JSON.parse(raw) : null;
                        } catch (e) {
                            console.error(e);
                            return null;
                        }
                    }
                };

                var STORAGE_KEY = 'cinebook-data-v3';

                function CinemaService() {
                    this._movies = [];
                    this._showtimes = [];
                    this._bookings = [];
                    this._customers = [];
                    this._load();
                    if (this._movies.length === 0) this._seedData();
                }
                CinemaService.prototype.addMovie = function(movie) {
                    this._movies.push(movie);
                    this._save();
                };
                CinemaService.prototype.removeMovie = function(id) {
                    this._movies = this._movies.filter(function(m) {
                        return m.getId() !== id;
                    });
                    this._showtimes = this._showtimes.filter(function(s) {
                        return s.getMovie().getId() !== id;
                    });
                    this._save();
                };
                CinemaService.prototype.getMovies = function() {
                    return this._movies.slice();
                };

                // แก้ไขข้อมูลหนัง (ตรวจข้อมูลก่อน แล้วค่อยบันทึก)
                CinemaService.prototype.updateMovie = function(id, f) {
                    var m = this._movies.filter(function(x) {
                        return x.getId() === id;
                    })[0];
                    if (!m) throw new Error('ไม่พบหนัง');
                    var dur = Number(f.duration);
                    if (!f.title.trim()) throw new Error('ชื่อหนังห้ามว่าง');
                    if (!f.genre.trim()) throw new Error('แนวหนังห้ามว่าง');
                    if (!(dur > 0)) throw new Error('ความยาวต้องมากกว่า 0');
                    m.setTitle(f.title.trim());
                    m.setGenre(f.genre.trim());
                    m.setDuration(dur);
                    m.setRating(f.rating);
                    m.setPosterUrl(f.posterUrl);
                    this._save();
                };

                CinemaService.prototype.addShowtime = function(st) {
                    this._showtimes.push(st);
                    this._save();
                };
                CinemaService.prototype.removeShowtime = function(id) {
                    this._showtimes = this._showtimes.filter(function(s) {
                        return s.getId() !== id;
                    });
                    this._save();
                };
                CinemaService.prototype.getShowtimes = function() {
                    return this._showtimes.slice();
                };
                CinemaService.prototype.getShowtimesForMovie = function(movieId) {
                    return this._showtimes.filter(function(s) {
                        return s.getMovie().getId() === movieId;
                    });
                };

                // แก้ไขรอบฉาย: ราคาแก้ได้เฉพาะรอบที่ยังไม่มีคนจอง
                CinemaService.prototype.updateShowtime = function(id, f) {
                    var st = this._showtimes.filter(function(x) {
                        return x.getId() === id;
                    })[0];
                    if (!st) throw new Error('ไม่พบรอบฉาย');
                    var price = Number(f.price);
                    if (!f.startTime) throw new Error('กรุณาระบุวันเวลารอบฉาย');
                    if (!f.hall.trim()) throw new Error('ชื่อโรงห้ามว่าง');
                    if (!(price > 0)) throw new Error('ราคาต้องมากกว่า 0');
                    if (price !== st.getPrice()) st.setPrice(price); // throw ถ้ามีคนจองแล้ว (ก่อนแก้อย่างอื่น)
                    st.setStartTime(f.startTime);
                    st.setHall(f.hall.trim());
                    this._save();
                };

                CinemaService.prototype.getOrCreateCustomer = function(name, email) {
                    var found = this._customers.filter(function(c) {
                        return c.getEmail() === email;
                    })[0];
                    if (!found) {
                        found = new Customer('CUS-' + Date.now(), name, email);
                        this._customers.push(found);
                        this._save();
                    }
                    return found;
                };

                CinemaService.prototype.createBooking = function(customer, showtimeId, seatNumbers, payment) {
                    var showtime = this._showtimes.filter(function(s) {
                        return s.getId() === showtimeId;
                    })[0];
                    if (!showtime) throw new Error('ไม่พบรอบฉายนี้');
                    if (seatNumbers.length === 0) throw new Error('กรุณาเลือกที่นั่งอย่างน้อย 1 ที่');
                    for (var i = 0; i < seatNumbers.length; i++) {
                        var seat = showtime.findSeat(seatNumbers[i]);
                        if (!seat) throw new Error('ไม่พบที่นั่ง ' + seatNumbers[i]);
                        if (!seat.isAvailable()) throw new Error('ที่นั่ง ' + seatNumbers[i] + ' ถูกจองไปแล้ว');
                    }
                    var tickets = seatNumbers.map(function(n) {
                        var s = showtime.findSeat(n);
                        s.book();
                        return new Ticket('TKT-' + Date.now() + '-' + n, showtime, n, showtime.getPrice());
                    });
                    var booking = new Booking('BKG-' + Date.now(), customer.getId(), tickets, payment);
                    customer.addBooking(booking.getId());
                    this._bookings.push(booking);
                    this._save();
                    return booking;
                };

                CinemaService.prototype.getBookingsForCustomer = function(id) {
                    return this._bookings.filter(function(b) {
                        return b.getCustomerId() === id;
                    });
                };
                CinemaService.prototype.getAllBookings = function() {
                    return this._bookings.slice();
                };

                CinemaService.prototype._save = function() {
                    var data = {
                        movies: this._movies.map(function(m) {
                            return {
                                id: m.getId(),
                                title: m.getTitle(),
                                genre: m.getGenre(),
                                duration: m.getDuration(),
                                rating: m.getRating(),
                                posterUrl: m.getPosterUrl()
                            };
                        }),
                        showtimes: this._showtimes.map(function(s) {
                            return {
                                id: s.getId(),
                                movieId: s.getMovie().getId(),
                                startTime: s.getStartTime(),
                                hall: s.getHall(),
                                price: s.getPrice(),
                                bookedSeats: s.getSeats().filter(function(x) {
                                    return !x.isAvailable();
                                }).map(function(x) {
                                    return x.getSeatNumber();
                                })
                            };
                        }),
                        bookings: this._bookings.map(function(b) {
                            var firstTicket = b.getTickets()[0];
                            return {
                                id: b.getId(),
                                customerId: b.getCustomerId(),
                                showtimeId: firstTicket ? firstTicket.getShowtime().getId() : '',
                                seatNumbers: b.getTickets().map(function(t) {
                                    return t.getSeatNumber();
                                }),
                                totalPrice: b.getTotalPrice(),
                                bookingTime: b.getBookingTime(),
                                paymentSummary: b.getPaymentSummary()
                            };
                        }),
                        customers: this._customers.map(function(c) {
                            return {
                                id: c.getId(),
                                name: c.getName(),
                                email: c.getEmail()
                            };
                        })
                    };
                    StorageService.save(STORAGE_KEY, data);
                };

                CinemaService.prototype._load = function() {
                    var data = StorageService.load(STORAGE_KEY);
                    if (!data) return;
                    var self = this;
                    this._movies = data.movies.map(function(m) {
                        return new Movie(m.id, m.title, m.genre, m.duration, m.rating, m.posterUrl);
                    });
                    this._customers = data.customers.map(function(c) {
                        return new Customer(c.id, c.name, c.email);
                    });
                    this._showtimes = data.showtimes.map(function(s) {
                        var movie = self._movies.filter(function(m) {
                            return m.getId() === s.movieId;
                        })[0];
                        var st = new Showtime(s.id, movie, s.startTime, s.hall, s.price);
                        st.restoreBookedSeats(s.bookedSeats);
                        return st;
                    });
                    this._bookings = data.bookings.map(function(b) {
                        var st = self._showtimes.filter(function(s) {
                            return s.getId() === b.showtimeId;
                        })[0];
                        var tickets = st ? b.seatNumbers.map(function(n) {
                            return new Ticket(b.id + '-' + n, st, n, st.getPrice());
                        }) : [];
                        return new Booking(b.id, b.customerId, tickets, new ReloadedPayment(b.totalPrice, b.paymentSummary));
                    });
                    this._bookings.forEach(function(b) {
                        var c = self._customers.filter(function(c) {
                            return c.getId() === b.getCustomerId();
                        })[0];
                        if (c) c.addBooking(b.getId());
                    });
                };

                    var m1 = new Movie('MOV-1', 'Galactic Drift', 'Sci-Fi', 128, 'PG-13');
                    var m2 = new Movie('MOV-2', 'Whispering Pines', 'Horror', 102, 'R');
                    var m3 = new Movie('MOV-3', 'Recipe for Laughter', 'Comedy', 95, 'G');
                    this._movies.push(m1, m2, m3);
                    this._showtimes.push(
                        new Showtime('SHW-1', m1, '2026-09-25T13:00', 'Hall 1', 180),
                        new Showtime('SHW-2', m1, '2026-09-25T19:30', 'Hall 1', 220),
                        new Showtime('SHW-3', m2, '2026-09-25T21:00', 'Hall 2', 200),
                        new Showtime('SHW-4', m3, '2026-09-26T15:00', 'Hall 3', 160)
                    );
                    this._save();
                };

                                            }),
                                            isAddingShow ?
                                            h('form', {
                                                    onSubmit: function(e) {
                                                        submitMiniShowtime(e, movie);
                                                    },
                                                    className: 'inline-form'
                                                },
                                                h('input', {
                                                    type: 'datetime-local',
                                                    value: miniStart,
                                                    onChange: function(e) {
                                                        setMiniStart(e.target.value);
                                                    },
                                                    required: true
                                                }),
                                                h('input', {
                                                    placeholder: 'โรง',
                                                    value: miniHall,
                                                    onChange: function(e) {
                                                        setMiniHall(e.target.value);
                                                    },
                                                    required: true
                                                }),
                                                h('input', {
                                                    type: 'number',
                                                    placeholder: 'ราคา',
                                                    value: miniPrice,
                                                    onChange: function(e) {
                                                        setMiniPrice(e.target.value);
                                                    },
                                                    required: true
                                                }),
                                                h('button', {
                                                    type: 'submit',
                                                    className: 'primary small-btn'
                                                }, 'บันทึก'),
                                                h('button', {
                                                    type: 'button',
                                                    className: 'small-btn',
                                                    onClick: function() {
                                                        setAddShowMovieId(null);
                                                    }
                                                }, 'ยกเลิก')
                                            ) :
                                            h('button', {
                                                className: 'small-btn',
                                                onClick: function() {
                                                    setAddShowMovieId(movie.getId());
                                                }
                                            }, '+ เพิ่มรอบฉาย')
                                        )
                                    )
                                );
                            }))
                        );
                    } else if (tab === 'bookings') {
                        bodyEl = h('div', {
                                className: 'panel'
                            },
                            bookings.length === 0 ? h('p', {
                                className: 'muted'
                            }, 'ยังไม่มีการจอง') : null,
                            bookings.map(function(b) {
                                return h('div', {
                                        className: 'ticket-card',
                                        key: b.getId()
                                    },
                                    h('p', {
                                        className: 'muted'
                                    }, b.getId() + ' · ลูกค้า ' + b.getCustomerId() + ' · ' + new Date(b.getBookingTime()).toLocaleString('th-TH')),
                                    b.getTickets().map(function(t) {
                                        return h('p', {
                                            key: t.getId()
                                        }, '🎟️ ' + t.printSummary());
                                    }),
                                    h('p', null, h('strong', null, 'รวม ' + b.getTotalPrice() + ' บาท'), ' · ' + b.getPaymentSummary())
                                );
                            })
                        );
                    }

                    // ---- Modal แก้ไขหนัง / รอบฉาย ----
                    var modalEl = null;
                    if (editing && editing.type === 'movie') {
                        var em = movies.filter(function(x) {
                            return x.getId() === editing.id;
                        })[0];
                        if (em) modalEl = h(EditMovieModal, {
                            key: em.getId(),
                            service: service,
                            movie: em,
                            onClose: function() {
                                setEditing(null);
                            },
                            onSaved: function() {
                                setEditing(null);
                                force();
                            }
                        });
                    } else if (editing && editing.type === 'showtime') {
                        var es = service.getShowtimes().filter(function(x) {
                            return x.getId() === editing.id;
                        })[0];
                        if (es) modalEl = h(EditShowtimeModal, {
                            key: es.getId(),
                            service: service,
                            showtime: es,
                            onClose: function() {
                                setEditing(null);
                            },
                            onSaved: function() {
                                setEditing(null);
                                force();
                            }
                        });
                    }

                    return h('div', {
                        className: 'view'
                    }, headerEl, bodyEl, modalEl);
                }

                function App() {
                    var service = useMemo(function() {
                        return new CinemaService();
                    }, []);
                    var userState = useState(null);
                    var currentUser = userState[0],
                        setCurrentUser = userState[1];

                    function handleCustomerLogin(name, email) {
                        setCurrentUser(service.getOrCreateCustomer(name, email));
                    }

                    function handleAdminLogin(name) {
                        setCurrentUser(new Admin('ADM-' + Date.now(), name, name + '@cinema.local'));
                    }

                    if (!currentUser) {
                        return h('div', {
                            className: 'app-bg'
                        }, h(Login, {
                            onCustomerLogin: handleCustomerLogin,
                            onAdminLogin: handleAdminLogin
                        }));
                    }

                    var inner = currentUser.getRole() === 'Customer' ?
                        h(CustomerView, {
                            service: service,
                            customer: currentUser,
                            onLogout: function() {
                                setCurrentUser(null);
                            }
                        }) :
                        h(AdminView, {
                            service: service,
                            admin: currentUser,
                            onLogout: function() {
                                setCurrentUser(null);
                            }
                        });

                    return h('div', {
                        className: 'app-bg'
                    }, inner);
                }

                var root = ReactDOM.createRoot(document.getElementById('root'));
                root.render(h(App));
            } catch (err) {
                document.getElementById('root').innerHTML = '<div class="error-box">เกิดข้อผิดพลาด:\n' + (err && err.stack ? err.stack : err) + '</div>';
                console.error(err);
            }
        })();
    </script>
</body>

</html>
